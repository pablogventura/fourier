[project]
name = "fourierlab"
version = "1.0.0"
description = "Laboratorio local de series de Fourier, epiciclos y compresión"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=2.0",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
